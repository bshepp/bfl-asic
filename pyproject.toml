[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bfl-asic"
version = "0.2.0"
description = "Communication layer for Butterfly Labs BF0005G Jalapeno SHA-256 ASIC miner"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "pyserial",
    "pyserial-asyncio",
    "click",
    "numpy",
    "scipy",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]
ml = [
    "torch",
    "huggingface_hub",
]

[project.scripts]
bfl-asic = "bfl_asic.cli:main"

[tool.setuptools.packages.find]
include = ["bfl_asic*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: heavy ML training tests, excluded from the default fast run",
]
