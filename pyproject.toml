[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bfl-asic"
version = "0.2.0"
description = "A model-free characterization lab for retro mining silicon — began as a Butterfly Labs Jalapeno (BF0005G) SHA-256 ASIC toolkit, now spans the Icarus family (Block Erupter, Antminer U, GekkoScience)."
keywords = [
    "sha256", "asic", "bitcoin", "mining", "reverse-engineering",
    "icarus", "block-erupter", "avr32", "hardware", "cryptography",
]
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "pyserial",
    "pyserial-asyncio",
    "click",
    "numpy",
    "scipy",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]
ml = [
    "torch",
    "huggingface_hub",
]
ambient = [
    "bleak",   # BLE listener for Govee H5075 ambient sensors (bfl_asic.ambient)
]

[project.scripts]
bfl-asic = "bfl_asic.cli:main"

[tool.setuptools.packages.find]
include = ["bfl_asic*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: heavy ML training tests, excluded from the default fast run",
]
